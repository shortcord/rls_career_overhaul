#pls-demo .stars{position:absolute;inset:0;z-index:-2;opacity:.5;background-image:radial-gradient(1px 1px at 9% 18%,#d9fff4 99%,transparent),radial-gradient(1px 1px at 79% 62%,#1bdfb8 99%,transparent),radial-gradient(1px 1px at 42% 80%,#e6ffff 99%,transparent);background-size:103px 167px,179px 143px,137px 199px;animation:pls-stars 55s linear infinite}
#pls-demo .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(#0008,transparent 30%,#0003 70%,#0009)}
#pls-demo .edge{position:absolute;inset:13px;border:1px solid var(--teal);border-radius:20px;opacity:.7;pointer-events:none;box-shadow:0 0 12px #00ff7c15}
#pls-demo .brand{height:162px;text-align:center;position:relative;z-index:2;transform-origin:50% 50%;transition:transform 1.05s cubic-bezier(.2,.8,.2,1),opacity .7s}
#pls-demo .skull-wrap{position:absolute;top:2px;left:50%;width:107px;height:133px;transform:translateX(-50%);overflow:hidden;opacity:.65;transition:opacity 2s,filter 2s;filter:drop-shadow(0 0 6px #00ff7c66);mix-blend-mode:screen}
#pls-demo .skull{width:100%;height:auto;filter:grayscale(1) sepia(1) saturate(7) hue-rotate(103deg);mix-blend-mode:screen}
#pls-demo .wordmark{position:relative;padding-top:87px;white-space:nowrap;font-family:Orbitron,Arial,sans-serif;font-style:italic;font-weight:900;font-size:clamp(25px,6.1vw,38px);letter-spacing:1px;color:var(--teal);text-shadow:0 2px 4px #000,0 0 15px #000;line-height:1.25}
#pls-demo .submark{position:relative;letter-spacing:4px;font-family:Orbitron,Arial,sans-serif;font-size:10px;color:#d6eee7;margin-top:4px}
#pls-demo .controls{position:relative;z-index:2}
#pls-demo .glass{position:relative;border:1px solid #59867e;border-radius:20px;background:linear-gradient(176deg,#e8fff52e 0%,#ffffff08 10%,#01130df0 44%,#010807f5 73%,#08d7b12e 97%);box-shadow:inset 0 2px 2px #f4fffb9e,inset 2px 0 3px #abd6d342,inset 0 -3px 5px #00a98949,0 5px 9px #0005;color:#edf9f6}
#pls-demo button.glass{padding:10px 8px;min-height:43px;transition:box-shadow .15s,border-color .15s,transform .15s}
#pls-demo button:hover,#pls-demo select:hover{border-color:var(--teal)}
#pls-demo button:active{transform:translateY(1px)}
#pls-demo button.active{border-color:var(--teal);background:linear-gradient(170deg,#a6fff257,#014e40c9 25%,#00130be8 70%,#00ff7c6e);box-shadow:inset 0 2px 2px #d4fff6,0 0 13px #00ff7c3a,inset 0 -3px 6px #00ff7c66}
#pls-demo .floors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;font-size:15px}
#pls-demo .modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:15px}
#pls-demo .modes button{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px}
#pls-demo .modes svg{width:21px;height:21px}
#pls-demo .dial-pair{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:15px 0 13px}
#pls-demo .dial{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#020d0df5 46%,#163a343d 58%,#040b09 61%,#75ac9b80 64%,#020a09 68%);box-shadow:0 6px 12px #0008}
#pls-demo .dial svg{width:100%;height:100%;display:block;overflow:visible}
#pls-demo .rim{fill:none;stroke:#7baea4;stroke-width:1.2}
#pls-demo .track{fill:none;stroke:#4e9c8938;stroke-width:9;stroke-linecap:round}
#pls-demo .arc{fill:none;stroke:var(--teal);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 3px #00ff7c99)}
#pls-demo .knob{fill:#c6fff0;stroke:#19cda9;stroke-width:2;filter:drop-shadow(0 0 3px #00ff7c)}
#pls-demo .dial-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;touch-action:none;cursor:grab;z-index:2}
#pls-demo .dial:focus-within{outline:2px solid #c9fff2;outline-offset:3px}
#pls-demo .dial-center{position:absolute;inset:30% 16%;z-index:3;text-align:center;pointer-events:none;display:flex;align-items:center;justify-content:center}
#pls-demo .dial-center label{font-size:10px;letter-spacing:1px;color:#b7d3cc;width:100%}
#pls-demo .number{display:block;pointer-events:auto;background:transparent;border:0;text-align:center;width:100%;font:italic 900 clamp(23px,5.7vw,34px) Orbitron,Arial,sans-serif;color:var(--teal);padding:4px 0;appearance:textfield;min-width:0}
#pls-demo .number::-webkit-inner-spin-button{appearance:none}
#pls-demo .number:focus{font-size:16px}
#pls-demo .speed-value{display:flex;align-items:center;justify-content:center;color:var(--teal);font:italic 900 27px Orbitron,Arial,sans-serif}
#pls-demo .speed-value input{width:70%;max-width:75px}
#pls-demo .steps{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 7px;margin-top:6px}
#pls-demo .steps button{padding:0;min-height:32px;font-size:25px;line-height:1}
#pls-demo .pattern{display:flex;align-items:center;gap:14px;padding:7px 14px;margin-bottom:10px;font-size:12px;color:#b3cec8}
#pls-demo select{background:transparent;border:0;flex:1;min-width:0;padding:7px;font-size:16px;color:#effffb}
#pls-demo option{background:#072019;color:#effffb}
#pls-demo .colors{display:flex;align-items:center;gap:9px;padding:9px 12px;margin-bottom:10px}
#pls-demo .picker-label{font-size:10px;color:#b3cec8}
#pls-demo .picker{display:block;border:0;width:32px;height:29px;background:transparent;padding:0}
#pls-demo .hex{background:transparent;border:0;width:90px;font-size:13px;padding:6px 0;min-width:0}
#pls-demo .swatch{border:1px solid #ffffff6b;border-radius:50%;width:24px;height:24px;flex-shrink:0;background:var(--swatch);box-shadow:inset 0 2px 3px #fffa,0 0 8px color-mix(in srgb,var(--swatch),transparent 65%)}
#pls-demo .favorites{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 9px;font-size:12px}
#pls-demo .favorites>span{font-size:11px;color:#b3cec8}
#pls-demo .favorite,#pls-demo .save{background:linear-gradient(#293f3c88,#000a);border:1px solid #6c94887d;border-radius:12px;padding:9px 8px;flex:1;min-width:0}
#pls-demo .favorite[data-favorite="Pink"]{color:#ff8bdd}#pls-demo .favorite[data-favorite="Teal"]{color:#48f5de}
#pls-demo .save-row{display:flex;gap:8px;margin-top:8px}
#pls-demo .favorite-name{width:100%;min-width:0;background:#041912;border:1px solid #577e70;border-radius:12px;padding:9px;font-size:14px}
#pls-demo footer{display:flex;gap:6px;justify-content:space-between;align-items:center;position:relative;z-index:2;margin-top:17px;padding-bottom:1px;font-size:10px;color:#8caf9f}
#pls-demo .credit{font:italic 700 12px Orbitron,Arial,sans-serif;color:var(--teal);background:#020d09;padding:2px 6px;transform:translateY(7px);white-space:nowrap}
#pls-demo .feedback{max-width:72%;font-size:11px}
#pls-demo .timing{text-align:center;color:#a6c6ba;font-size:12px;margin:13px auto 0;background:#0b1713;border-radius:12px;padding:8px;min-height:32px}
#pls-demo .boot-label{position:absolute;top:61%;left:0;width:100%;text-align:center;font:10px Orbitron,Arial,sans-serif;letter-spacing:3px;opacity:0;transition:opacity .5s;pointer-events:none}
#pls-demo .slide{transition:opacity .65s,transform .85s cubic-bezier(.16,1,.3,1);opacity:1;transform:translateY(0)}
#pls-demo .tablet.booting .brand{transform:translateY(165px) scale(1.13)}
#pls-demo .tablet.booting .skull-wrap{opacity:.04;filter:blur(5px)}
#pls-demo .tablet.ignition .skull-wrap{opacity:.8;filter:blur(0) drop-shadow(0 0 8px #00ff7c55)}
#pls-demo .tablet.booting .slide{opacity:0;transform:translateY(34px);pointer-events:none}
#pls-demo .tablet.booting .boot-label{opacity:.6}
#pls-demo .tablet.booting .feedback{opacity:0}
#pls-demo .tablet.booting .edge{animation:pls-edge 1.8s ease both}
#pls-demo .tablet.revealing .slide:nth-child(1){transition-delay:0ms}#pls-demo .tablet.revealing .slide:nth-child(2){transition-delay:120ms}#pls-demo .tablet.revealing .slide:nth-child(3){transition-delay:240ms}#pls-demo .tablet.revealing .slide:nth-child(4){transition-delay:360ms}#pls-demo .tablet.revealing .slide:nth-child(5){transition-delay:480ms}#pls-demo .tablet.revealing .slide:nth-child(6){transition-delay:600ms}
#pls-demo [data-style="cascade"] .tablet.booting .slide{transform:translateX(50px)}
#pls-demo [data-style="cascade"] .tablet.booting .skull-wrap{opacity:.3;filter:blur(2px)}
#pls-demo .tablet.afterglow .skull-wrap{opacity:.04;filter:blur(4px)}
#pls-demo .tablet.resolved .skull-wrap{opacity:.7;filter:blur(0) drop-shadow(0 0 5px #00ff7c4d)}
#pls-demo .paused-motion .cosmos,#pls-demo .paused-motion .stars{animation-play-state:paused}
@keyframes pls-drift{from{transform:translate(-1%,-1%) scale(1.07)}to{transform:translate(2%,3%) scale(1.15)}}
@keyframes pls-stars{from{transform:translateY(0)}to{transform:translateY(-45px)}}
@keyframes pls-edge{0%{opacity:0;clip-path:inset(0 100% 95% 0)}60%{opacity:1;clip-path:inset(0 0 0 0);box-shadow:0 0 20px #00ff7c80}100%{opacity:.7;clip-path:inset(0)}}
@media(max-width:380px){#pls-demo .tablet{padding:20px 19px 16px;min-height:738px}#pls-demo .brand{height:151px}#pls-demo .wordmark{font-size:25px}#pls-demo .submark{letter-spacing:2px;font-size:9px}#pls-demo .colors{gap:6px;padding:8px}#pls-demo .hex{width:75px;font-size:11px}#pls-demo .swatch{width:20px;height:20px}#pls-demo .favorites{gap:4px;padding:8px 6px}#pls-demo .favorite,#pls-demo .save{padding:9px 5px}#pls-demo .dial-pair{gap:9px}#pls-demo .dial-center label{font-size:9px;letter-spacing:0}#pls-demo .number{font-size:24px}#pls-demo .floors{font-size:13px}}
@media(prefers-reduced-motion:reduce){#pls-demo .cosmos,#pls-demo .stars{animation:none}#pls-demo .brand,#pls-demo .slide,#pls-demo .skull-wrap{transition-duration:.01s!important}#pls-demo .edge{animation:none!important}}
</style>
<style>
@media(max-width:380px){#pls-demo .colors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}#pls-demo .picker-label{grid-column:span 2;display:flex;align-items:center;gap:8px}#pls-demo .hex{grid-column:span 3;width:100%;text-align:right}#pls-demo .swatch{width:26px;height:26px;justify-self:center}}
</style>

function renderFixtureStyles(){const state=fixtureStatus[s.floor];const key=JSON.stringify([s.floor,state]);if(key===fixtureRenderKey)return;fixtureRenderKey=key;stylePage.querySelector('.fixture-floor').textContent=s.floor==='upstairs'?'Upstairs':'Downstairs';const cards=stylePage.querySelector('.fixture-cards');const scrollTop=cards.scrollTop;cards.replaceChildren();const options=[...(state?.options||[])].sort((a,b)=>Number(['hextrails','arrowline'].includes(a.id))-Number(['hextrails','arrowline'].includes(b.id)));for(const opt of options){const b=document.createElement('button');b.className='fixture-card glass cursor-interaction';b.dataset.fixtureStyle=opt.id;b.classList.toggle('fixture-wide',['hextrails','arrowline'].includes(opt.id));b.disabled=!opt.available;const selected=state.selected===opt.id&&opt.available;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));b.innerHTML=fixtureIcon(opt.id);const label=document.createElement('strong');label.textContent=opt.label;b.append(label);const note=document.createElement('small');note.textContent=!opt.available?'Not placed on this floor':selected?'Selected':'Select style';b.append(note);b.onclick=()=>{sound();commitNow();window.plsSend({action:'fixtureStyle',group:s.floor,style:opt.id})};cards.append(b)}cards.scrollTop=scrollTop}

function commitNow(){clearTimeout(commitTimer);commitTimer=null;if(!initialized)return;const signature=JSON.stringify(group());if(signature===baseline)return;baseline=signature;window.plsSend({action:'commit',group:s.floor,state:toGame(group())})}

window.plsReceive=data=>{
  if(!data||!data.groups)return;

  if(commitTimer&&!data.error)return;

  s.floor=data.group;lastFloor=s.floor;s.presets=Object.fromEntries(Object.entries(data.presets||{}).map(([k,v])=>[k,fromGame(v)]));

};

let accent='#00ff7c';const themeStyles=[];
function applyAccent(value){if(!/^#[0-9a-f]{6}$/i.test(value))return;accent=readableAccent(value);window.plsAccent=accent;if(!themeStyles.length)document.querySelectorAll('style').forEach(el=>themeStyles.push([el,el.textContent]));for(const [el,base] of themeStyles)el.textContent=base.replace(/#00ff7c/gi,accent);root.style.setProperty('--teal',accent);settings.querySelector('.accent-picker').value=accent;settings.querySelector('.accent-hex').textContent=accent.toUpperCase();syncAccentChart()}
const accentSection=document.createElement('div');accentSection.className='accent-settings';accentSection.innerHTML='<button class="accent-picker glass cursor-interaction" aria-expanded="false"><span class="chosen-color"></span>Choose UI Color</button><output class="accent-hex" aria-label="Selected UI color"></output><div class="accent-presets"></div><button class="reset-accent glass cursor-interaction">Reset to Punisher Green</button>';

for(const [label,value] of [['Signature Green','#00ff7c'],['Blue','#4f9fff'],['Violet','#b28aff'],['Pink','#ff6fc5'],['Amber','#ffc35c']]){const b=document.createElement('button');b.className='accent-swatch cursor-interaction';b.style.background=value;b.setAttribute('aria-label',label);b.title=label;b.onclick=()=>{sound();applyAccent(value);savePreferences()};accentSection.querySelector('.accent-presets').append(b)}
function savePreferences(){window.plsSend({action:'preferences',preferences:{sound:!s.muted,motion:section.querySelector('.motion').checked,accent}})}

function preferences(p){s.muted=p.sound===false;settings.querySelector('.setting-sound').checked=!s.muted;settings.querySelector('.setting-motion').checked=p.motion!==false;section.querySelector('.motion').checked=p.motion!==false;tablet.classList.toggle('paused-motion',p.motion===false);if(activeVariant===s)startup.muted=s.muted;if(s.muted)stopEffects();applyAccent(p.accent||'#00ff7c')}
function accentHsv(hex){const a=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255),v=Math.max(...a),m=Math.min(...a),d=v-m;let h=0;if(d)h=(v===a[0]?(a[1]-a[2])/d+(a[1]<a[2]?6:0):v===a[1]?(a[2]-a[0])/d+2:(a[0]-a[1])/d+4)*60;return{h,s:v?d/v:0,v}}

chooser.after(chart);let chartHue=150;

<script>
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();window.plsNavigate?.('back')}e.stopPropagation()});
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.pls==='state')window.plsReceive?.(e.data.data);if(e.data?.pls==='preferences')window.plsPreferences?.(e.data.data)});
window.plsSend=command=>parent.postMessage({pls:'command',data:command},'*');
// Reserve gameplay keys only while the favorite-name field is being edited.
(()=>{
 const input=document.querySelector('.favorite-name');let active=false;
 const update=value=>{if(active===value)return;active=value;window.plsSend({action:'favoriteTyping',active:value});};
 const sync=()=>update(Boolean(document.hasFocus()&&document.activeElement===input&&input.getClientRects().length&&getComputedStyle(input).visibility!=='hidden'));
 input.addEventListener('focus',sync);input.addEventListener('blur',()=>update(false));
 window.addEventListener('focus',sync);window.addEventListener('blur',()=>update(false));
 window.addEventListener('pagehide',()=>update(false));
 window.addEventListener('message',e=>{if(e.source===parent&&e.data?.pls==='releaseFavoriteTyping'){input.blur();update(false);}});
 const observer=new MutationObserver(sync);
 for(let el=input;el;el=el.parentElement)observer.observe(el,{attributes:true,attributeFilter:['hidden','class','style']});
})();
const wrap=document.querySelector('#pls-demo .demo-wrap');let fitQueued=false;function fit(){fitQueued=false;const cards=wrap.querySelector('.fixture-cards');if(window.plsFixtureHeight&&wrap.querySelector('.choosing-fixture')){const overhead=wrap.offsetHeight-cards.offsetHeight;const height=Math.max(180,window.plsFixtureHeight-overhead);if(Math.abs(cards.offsetHeight-height)>1)cards.style.height=height+'px'}const scale=Math.min(1,(innerWidth-8)/440,(innerHeight-8)/wrap.offsetHeight);wrap.style.transform='none';wrap.style.zoom=String(Math.max(.1,Math.floor(scale*1000)/1000))}function scheduleFit(){if(!fitQueued){fitQueued=true;requestAnimationFrame(fit)}}new ResizeObserver(scheduleFit).observe(wrap);window.addEventListener('resize',scheduleFit);fit();
window.plsSend({action:'ready'});
</script>

<script>// Spatial D-pad navigation, independent of gameplay camera/movement axes.
(()=>{
 let selected=null,editing=false,colorDirty=false;
 let axis={x:0,y:0},stickTimer=null;
 const key=el=>el?.dataset.fixtureStyle||el?.dataset.favorite||null;
 const tablet=document.querySelector('.tablet');
 const hint=document.createElement('div');hint.className='pad-hint';hint.hidden=true;tablet.querySelector('footer').prepend(hint);
 const visible=el=>el.getClientRects().length&&getComputedStyle(el).visibility!=='hidden'&&!el.closest('[hidden]')&&!el.disabled;
 function candidates(){
  const modal=tablet.querySelector('.ui-settings:not([hidden])')||tablet;
  return [...modal.querySelectorAll('button,input[type="checkbox"],.dial-unit,.sv-area,.hue-control,.sat-control,.val-control,.ui-accent-field,.ui-accent-hue,.ui-accent-saturation,.ui-accent-value')].filter(el=>visible(el)&&!el.closest('.demo-tools')&&!el.matches('[data-step]')&&!el.closest('.save-row')&&!el.matches('.save'));
 }
 const isColor=el=>el?.matches('.sv-area,.hue-control,.sat-control,.val-control,.ui-accent-field,.ui-accent-hue,.ui-accent-saturation,.ui-accent-value');
 const isField=el=>el?.matches('.sv-area,.ui-accent-field');
 const isAccent=()=>!!selected?.closest('.ui-accent-chart');
 const colorSliders=()=>isAccent()?['.ui-accent-saturation','.ui-accent-value']:['.sat-control','.val-control'];
 function commitColor(){if(colorDirty){if(!isAccent())window.plsQuietSelection(()=>tablet.querySelector('.hue-control').dispatchEvent(new Event('change',{bubbles:true})));colorDirty=false;}}
 function setRange(el,value){const before=el.value;el.value=Math.max(Number(el.min),Math.min(Number(el.max),value));if(el.value===before)return;colorDirty=true;el.dispatchEvent(new Event('input',{bubbles:true}));window.plsSound('tick');}
 function finish(){
  if(editing)commitColor();
  if(isField(selected)&&editing)window.plsSend({action:'colorAdjust',active:false});
  clearInterval(stickTimer);stickTimer=null;axis={x:0,y:0};editing=false;selected?.classList.remove('pad-edit');
 }
 function label(){hint.textContent=editing?(isField(selected)?'Left stick Color · A/B Done · Right stick Look':'Hold ◀ ▶ Adjust · A/B Done'):'D-pad Move · A Select · B Back';hint.hidden=false;}
 function choose(el){
  const changed=selected!==el;
  finish();
  tablet.querySelectorAll('.pad-focus,.pad-edit').forEach(n=>n.classList.remove('pad-focus','pad-edit'));
  selected=el;editing=false;
  if(!el)return;
  if(changed)window.plsSound('hover');
  el.classList.add('pad-focus');
  const list=el.closest('.fixture-cards');
  if(list){const a=el.getBoundingClientRect(),b=list.getBoundingClientRect(),scale=list.getBoundingClientRect().height/list.offsetHeight;if(a.top<b.top)list.scrollTop-=(b.top-a.top)/scale+8;else if(a.bottom>b.bottom)list.scrollTop+=(a.bottom-b.bottom)/scale+8;}
  label();
 }
 function back(){
  if(editing){finish();label();return;}
  const settings=tablet.querySelector('.ui-settings:not([hidden])');
  if(settings&&!settings.querySelector('.ui-accent-chart').hidden){settings.querySelector('.accent-picker').click();choose(settings.querySelector('.accent-picker'));return;}
  if(settings){settings.querySelector('.settings-done').click();choose(tablet.querySelector('.settings-gear'));return;}
  const save=tablet.querySelector('.save-row:not([hidden])');if(save){save.hidden=true;return;}
  if(tablet.querySelector('.choosing-fixture')){tablet.querySelector('.fixture-back').click();choose(tablet.querySelector('.fixture-open'));return;}
  tablet.querySelector('.close-controller').click();
 }
 window.plsNavigate=action=>{
  if(action==='back'){back();return;}
  if(tablet.matches('.booting,.awaiting-start'))return;
  const items=candidates();if(!items.length)return;
  if(!items.includes(selected))choose(items.find(el=>key(selected)&&key(el)===key(selected))||items.find(el=>el.matches('[data-floor].active'))||items[0]);
  if(action==='select'){
   if(selected.matches('.dial-unit')||isColor(selected)){
    window.plsSound('select');
    if(editing)finish();else{
     editing=true;selected.classList.add('pad-edit');
     if(isField(selected)){
      window.plsSend({action:'colorAdjust',active:true});
      stickTimer=setInterval(()=>{
       if(!visible(selected)){finish();return;}
       for(const [dir,selector] of [['x',colorSliders()[0]],['y',colorSliders()[1]]]){
        const v=axis[dir];if(Math.abs(v)<.18)continue;
        const el=tablet.querySelector(selector);setRange(el,Number(el.value)+Math.sign(v)*Math.max(1,Math.abs(v)*2));
       }
      },isAccent()?60:33);
     }
    }label();
   }
   else {const old=selected;selected.click();if(!visible(old))choose(candidates()[0]);}
   return;
  }
  if(editing){
   if(action==='left'||action==='right'){
    const sign=action==='left'?-1:1;
    if(selected.matches('.dial-unit'))window.plsQuietSelection(()=>selected.querySelector('[data-step="'+sign+'"]').click());
    else if(selected.matches('input'))setRange(selected,Number(selected.value)+sign*(selected.matches('.hue-control,.ui-accent-hue')?3:1));
    else {const slider=tablet.querySelector(colorSliders()[0]);setRange(slider,Number(slider.value)+sign);}
   }return;
  }
  const r=selected.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2;
  const vertical=action==='up'||action==='down',sign=action==='up'||action==='left'?-1:1;
  const cards=items.filter(el=>el.matches('.fixture-card'));
  if(action==='up'&&selected.matches('.fixture-back')&&cards.length){choose(cards[cards.length-1]);return;}
  // Compare cards within their scroll container before considering fixed controls.
  // An offscreen next row must win over the visually nearer Back button.
  let pool=items;
  if(selected.matches('.fixture-card')){
   pool=cards;
   if(vertical&&!cards.some(el=>el!==selected&&(el.getBoundingClientRect().top+el.getBoundingClientRect().height/2-y)*sign>4)){
    if(action==='down')choose(tablet.querySelector('.fixture-back'));
    else choose(items.find(el=>el.matches('[data-floor].active'))||items.find(el=>el.matches('[data-floor]')));
    return;
   }
  }
  let best=null,score=Infinity;
  for(const el of pool){if(el===selected)continue;const q=el.getBoundingClientRect(),dx=q.x+q.width/2-x,dy=q.y+q.height/2-y,forward=(vertical?dy:dx)*sign,side=vertical?Math.max(0,r.left-q.right,q.left-r.right):Math.max(0,r.top-q.bottom,q.top-r.bottom);if(forward<4)continue;if(!vertical&&Math.min(r.bottom,q.bottom)-Math.max(r.top,q.top)<Math.min(r.height,q.height)*.5)continue;const cost=forward+side*3;if(cost<score){score=cost;best=el;}}
  if(best)choose(best);
 };
 window.addEventListener('message',e=>{
  if(e.source!==parent)return;
  if(e.data?.pls==='navigate')window.plsNavigate(e.data.action);
  if(e.data?.pls==='padRelease')commitColor();
  if(e.data?.pls==='padCancel'){finish();label();}
  if(e.data?.pls==='colorAxis'&&editing&&isField(selected)){
   const v=Math.max(-1,Math.min(1,e.data.value*2-1));axis[e.data.axis==='thumblx'?'x':'y']=v;
   if(Math.abs(axis.x)<.18&&Math.abs(axis.y)<.18)commitColor();
  }
 });
 window.addEventListener('pagehide',finish);
 document.addEventListener('pointerdown',()=>{choose(null);hint.hidden=true},true);
})();
</script>
